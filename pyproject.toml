[project]
name = "food-week-deep-research"
version = "0.1.0"
description = "Deep research over US food-spending survey data: a Lead fans out Researchers that query weekday food-spending, eating and time-use data, then a Writer turns their findings into a cited report"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
]

[dependency-groups]
# Only the offline build (build_data.py) needs these: it reads SAS, XPT and CSV files.
build = ["pyarrow>=15"]
dev = ["pytest>=8", "httpx>=0.27"]
